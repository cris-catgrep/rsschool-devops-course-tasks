# Action which checks if Terraform is installed and repository initialized in local host
name: Terraform deployment
run-name: ${{ github.actor }} is running Terraform actions
on: [push]
jobs:
  tf-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: hashicorp/setup-terraform@v3

  tf-plan:
    runs-on: ubuntu-latest
    needs: tf-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: hashicorp/setup-terraform@v3

      - name: tf init
        run: terraform init

      - name: tf plan
        run: terraform plan
