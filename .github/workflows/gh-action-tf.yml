# Action which checks if Terraform is installed and repository initialized in local host
name: Terraform deployment
run-name: ${{ github.actor }} is running Terraform actions
permissions:
  id-token: write
  contents: read
on:
  push:
    branches: 
     - main
     - task_1
jobs:
  tf-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::378084047153:role/GithubActionsRole
          aws-region: us-east-2

  tf-plan:
    runs-on: ubuntu-latest
    needs: tf-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::378084047153:role/GithubActionsRole
          aws-region: us-east-2

      - name: list
        run: ls

      - name: list
        run: pwd

      - name: tf init
        run: terraform init

      - name: tf plan
        run: terraform plan
